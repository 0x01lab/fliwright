<div id="trace-timeline-design" aria-label="Trace Viewer 时间轴布局草图">
  <section data-variant="常驻时间轴" aria-label="常驻时间轴方案"><div class="tv" data-layout="top"></div></section>
</div>
<style>
#trace-timeline-design .tv{--tv-bg:light-dark(#f5f8f7,#0f1b2a);--tv-panel:light-dark(#fff,#152436);--tv-fg:light-dark(#142d4e,#eaf2f5);--tv-muted:light-dark(#586d7d,#a5b7c7);--tv-line:light-dark(#d8e3e4,#2a3d50);--tv-accent:light-dark(#007f73,#00bfa6);--tv-on:light-dark(#fff,#142d4e);--tv-select:light-dark(#e1efeb,#233b48);--tv-pass:light-dark(#138346,#36d98a);--tv-fail:light-dark(#bf3c2e,#ff7b66);background:var(--tv-bg);color:var(--tv-fg);font:12px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:650px;border:1px solid var(--tv-line);border-radius:9px;overflow:hidden;container-type:inline-size}

#trace-timeline-design .tv .tv-fail{color:var(--tv-fail)}
#trace-timeline-design .tv .tv-chrome{display:flex;align-items:center;gap:8px;padding:10px 100px 10px 12px;background:var(--tv-panel);border-bottom:1px solid var(--tv-line);flex-wrap:wrap}
#trace-timeline-design .tv .tv-logo{display:grid;place-items:center;width:24px;height:24px;background:var(--tv-accent);color:var(--tv-on);border-radius:6px;font-weight:600}
#trace-timeline-design .tv .tv-name{font-weight:600}

#trace-timeline-design .tv .tv-content{min-width:0;display:flex;flex-direction:column}
#trace-timeline-design .tv .tv-timeline{background:var(--tv-panel);border-bottom:1px solid var(--tv-line);padding:8px 12px;min-width:0}

#trace-timeline-design .tv .tv-timer{min-width:86px}

#trace-timeline-design .tv .tv-bar{position:absolute;top:0;height:30px;min-height:30px;padding:0;min-width:7px;z-index:1}
#trace-timeline-design .tv .tv-bar:after{content:"";position:absolute;left:0;right:1px;top:12px;height:5px;background:var(--tv-pass);border-radius:2px;opacity:.65}
#trace-timeline-design .tv .tv-bar.failed:after{background:var(--tv-fail)}
#trace-timeline-design .tv .tv-bar[aria-pressed=true]{background:var(--tv-select)}
#trace-timeline-design .tv .tv-bar[aria-pressed=true]:after{opacity:1}
#trace-timeline-design .tv .tv-cursor{position:absolute;top:0;bottom:0;width:1px;background:var(--tv-accent);z-index:3;pointer-events:none}
#trace-timeline-design .tv .tv-playhead{position:absolute;top:0;transform:translateX(-50%);width:22px;height:22px;min-height:22px;padding:0;z-index:4;touch-action:none;cursor:ew-resize}
#trace-timeline-design .tv .tv-playhead:before{content:"";position:absolute;left:6px;top:0;width:10px;height:12px;background:var(--tv-accent);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
#trace-timeline-design .tv .tv-filmstrip{position:relative}
#trace-timeline-design .tv .tv-frame-marker{position:absolute;top:0;width:1px;background:var(--tv-line);pointer-events:none}
#trace-timeline-design .tv .tv-frame{position:absolute;display:flex;flex-direction:column;gap:4px;align-items:center;width:76px;height:118px;min-width:0;padding:4px;background:var(--tv-bg);z-index:2}
#trace-timeline-design .tv .tv-frame[hidden],#trace-timeline-design .tv .tv-frame-marker[hidden]{display:none}
#trace-timeline-design .tv .tv-frame[aria-pressed=true]{background:var(--tv-select)}
#trace-timeline-design .tv .tv-frame span{min-width:0;font-size:11px;overflow-wrap:anywhere}
#trace-timeline-design .tv .tv-mini{display:flex;flex-direction:column;gap:5px;width:64px;height:88px;flex:none;border:1px solid var(--tv-line);border-radius:4px;background:var(--tv-panel);padding:6px}
#trace-timeline-design .tv .tv-mini b{font-size:11px;font-weight:500}
#trace-timeline-design .tv .tv-mini i{height:3px;background:var(--tv-line);border-radius:2px}
#trace-timeline-design .tv .tv-mini i:last-child{background:var(--tv-accent);height:9px;margin-top:auto}
#trace-timeline-design .tv .tv-evidence{display:grid;grid-template-columns:minmax(180px,1fr) 270px;min-height:345px;flex:1}
#trace-timeline-design .tv .tv-stage{min-width:0;display:flex;flex-direction:column}
#trace-timeline-design .tv .tv-current{display:flex;justify-content:space-between;gap:8px;padding:7px 11px;border-bottom:1px solid var(--tv-line);font-size:11px;flex-wrap:wrap}
#trace-timeline-design .tv .tv-canvas{display:grid;place-items:center;flex:1;padding:12px;background-image:radial-gradient(var(--tv-line) .6px,transparent .6px);background-size:14px 14px;min-height:302px}
#trace-timeline-design .tv .tv-phone{width:160px;min-height:270px;padding:14px 12px;background:var(--tv-panel);border:1px solid var(--tv-line);border-radius:15px;box-shadow:0 8px 25px #00000014;display:flex;flex-direction:column;gap:12px}
#trace-timeline-design .tv .tv-phone-top{display:flex;justify-content:space-between;font-size:10px;color:var(--tv-muted)}
#trace-timeline-design .tv .tv-phone h4{font-size:14px;font-weight:500;margin:5px 0}
#trace-timeline-design .tv .tv-phone-line{height:6px;border-radius:3px;background:var(--tv-line);width:85%}
#trace-timeline-design .tv .tv-phone-box{background:var(--tv-bg);border-radius:5px;padding:12px 8px;font-size:11px}
#trace-timeline-design .tv .tv-phone-submit{padding:7px 4px;text-align:center;background:var(--tv-accent);color:var(--tv-on);border-radius:4px;margin-top:auto;font-size:11px}
#trace-timeline-design .tv .tv-caption{display:flex;justify-content:space-between;gap:5px;padding:5px 11px;border-top:1px solid var(--tv-line);font-size:11px;color:var(--tv-muted);flex-wrap:wrap}
#trace-timeline-design .tv .tv-inspector{background:var(--tv-panel);border-left:1px solid var(--tv-line);min-width:0}
#trace-timeline-design .tv .tv-tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--tv-line);padding:5px}
#trace-timeline-design .tv .tv-tabs button{font-size:11px;padding:5px 7px}
#trace-timeline-design .tv .tv-tabs button[aria-selected=true]{background:var(--tv-select)}
#trace-timeline-design .tv .tv-detail{padding:12px;overflow-wrap:anywhere}
#trace-timeline-design .tv .tv-detail h4{font-size:12px;margin:0 0 12px;font-weight:500}
#trace-timeline-design .tv .tv-detail dl{display:grid;grid-template-columns:65px 1fr;gap:8px 6px;margin:0}
#trace-timeline-design .tv .tv-detail dt{color:var(--tv-muted)}
#trace-timeline-design .tv .tv-detail dd{margin:0}
#trace-timeline-design .tv .tv-code{padding:10px;margin:12px 0 0;border-radius:5px;background:var(--tv-bg);font:11px/1.8 ui-monospace,monospace;white-space:pre-wrap}
#trace-timeline-design .tv .tv-empty{padding:15px 0;color:var(--tv-muted)}
#trace-timeline-design .tv[data-layout=bottom] .tv-timeline{order:2;border-bottom:0;border-top:1px solid var(--tv-line)}
#trace-timeline-design .tv[data-layout=bottom] .tv-evidence{min-height:445px}
#trace-timeline-design .tv .tv-timeline.collapsed .tv-filmstrip{display:none}
#trace-timeline-design .tv .tv-footer{padding:7px 12px;border-top:1px solid var(--tv-line);color:var(--tv-muted);font-size:11px}
@container(max-width:850px){#trace-timeline-design .tv .tv-workspace{grid-template-columns:165px minmax(0,1fr)}#trace-timeline-design .tv .tv-evidence{grid-template-columns:minmax(150px,1fr) 220px}#trace-timeline-design .tv .tv-frame{gap:4px}#trace-timeline-design .tv .tv-frame span{font-size:10px}}
@container(max-width:690px){#trace-timeline-design .tv .tv-workspace{grid-template-columns:145px minmax(0,1fr)}#trace-timeline-design .tv .tv-evidence{grid-template-columns:1fr}#trace-timeline-design .tv .tv-inspector{border-left:0;border-top:1px solid var(--tv-line)}#trace-timeline-design .tv .tv-detail{min-height:180px}#trace-timeline-design .tv .tv-filmstrip{grid-template-columns:repeat(2,minmax(0,1fr))}#trace-timeline-design .tv .tv-chrome{padding-right:12px}}
@container(max-width:430px){#trace-timeline-design .tv .tv-workspace{display:flex;flex-direction:column}#trace-timeline-design .tv .tv-sidebar{border-right:0;border-bottom:1px solid var(--tv-line)}#trace-timeline-design .tv .tv-steplist{display:grid;grid-template-columns:1fr 1fr}#trace-timeline-design .tv .tv-step{min-width:0}#trace-timeline-design .tv .tv-chrome{padding-top:46px}#trace-timeline-design .tv .tv-subhead{font-size:11px}}
@media(pointer:coarse){#trace-timeline-design .tv button,#trace-timeline-design .tv select{min-height:44px}#trace-timeline-design .tv .tv-track{height:48px}#trace-timeline-design .tv .tv-bar{height:44px}#trace-timeline-design .tv .tv-bar:after{top:20px}}
</style>
<script>
(()=>{
 const root=document.getElementById('trace-timeline-design');
 const steps=[
  {id:'open',title:'打开商品详情',kind:'navigation',start:0,end:1600,route:'/products/101',screen:'商品详情',body:'轻量旅行背包',button:'加入购物车',shot:1600},
  {id:'add',title:'加入购物车',kind:'action',start:1600,end:2800,route:'/cart',screen:'购物车',body:'轻量旅行背包 × 1',button:'去结算',shot:2800},
  {id:'checkout',title:'填写结算信息',kind:'step',start:2800,end:6400,route:'/checkout',screen:'确认订单',body:'收货信息已填写',button:'提交订单',shot:6400},
  {id:'submit',title:'点击提交订单',kind:'action',start:6400,end:8800,route:'/checkout',screen:'确认订单',body:'订单提交中…',button:'提交中…',shot:null},
  {id:'assert',title:'等待成功页可见',kind:'assertion',start:8800,end:12800,route:'/checkout',screen:'确认订单',body:'服务繁忙，请稍后重试',button:'重新提交',shot:12800,failed:true}
 ];
 const fmt=ms=>(ms/1000).toFixed(1)+'s';
 let saved=window.openai?.widgetState;
 function save(id,time){window.openai?.setWidgetState({modelContent:{selectedStep:id,cursorMs:time},privateContent:{}})?.catch(()=>{});}
 root.querySelectorAll('.tv').forEach((app,variant)=>{
  let selected=steps.some(s=>s.id===saved?.modelContent?.selectedStep)?saved.modelContent.selectedStep:'assert';
  let time=steps.find(s=>s.id===selected).start,playing=false,speed=1,tab='details',frameMode='failed',last=0,raf;
  app.innerHTML=`
   <header class="tv-chrome"><span class="tv-logo">F</span><span class="tv-name">Fliwright Trace Viewer</span><span class="tv-mute">交互草图 · 示例数据</span></header>
   <div class="tv-subhead"><span class="tv-result failed">×</span><strong>提交订单后展示成功页</strong><span class="tv-mute tv-mono">12.8s</span><span class="tv-pass">4 passed</span><span class="tv-fail">1 failed</span></div>
   <div class="tv-workspace">
    <aside class="tv-sidebar"><div class="tv-sidehead"><strong>步骤</strong><span class="tv-mute">5 个操作</span></div><div class="tv-mute" style="padding:0 6px 8px">▾ 下单流程</div><div class="tv-steplist">${steps.map(s=>`<button class="tv-step cursor-interaction" data-step="${s.id}" aria-pressed="false"><span class="tv-result ${s.failed?'failed':''}">${s.failed?'×':'✓'}</span><span class="tv-step-label">${s.title}<small>${s.kind} · ${fmt(s.end-s.start)}</small></span></button>`).join('')}</div></aside>
    <main class="tv-content">
     <section class="tv-timeline" aria-label="执行时间轴">
      <div class="tv-toolbar"><strong>执行时间轴</strong><span class="tv-timer tv-mono" aria-live="off"></span><button class="tv-prev cursor-interaction" aria-label="上一步">‹</button><button class="tv-play tv-primary cursor-interaction">播放</button><button class="tv-next cursor-interaction" aria-label="下一步">›</button><select class="tv-speed cursor-interaction" aria-label="回放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><button class="tv-jump cursor-interaction">跳到失败</button><label>截图 <select class="tv-frame-mode cursor-interaction" aria-label="时间轴截图显示"><option value="failed" selected>仅失败帧</option><option value="all">全部截图</option><option value="none">隐藏截图</option></select></label></div>
      <div class="tv-axis-viewport"><div class="tv-scale cursor-interaction"><span>0s</span><span>3.2s</span><span>6.4s</span><span>9.6s</span><span>12.8s</span></div>
      <div class="tv-surface">
       <div class="tv-track">${steps.map(s=>`<button class="tv-bar cursor-interaction ${s.failed?'failed':''}" data-step="${s.id}" style="left:${s.start/128}%;width:${(s.end-s.start)/128}%" aria-label="${s.title}，${fmt(s.start)} 至 ${fmt(s.end)}，${s.failed?'失败':'通过'}" data-tooltip="${s.title} · ${fmt(s.end-s.start)}" aria-pressed="false"></button>`).join('')}</div>
       <div class="tv-filmstrip">${steps.filter(s=>s.shot!==null).map(s=>`<span class="tv-frame-marker" data-marker="${s.id}" style="left:${s.shot/128}%" aria-hidden="true"></span><button class="tv-frame cursor-interaction" data-frame="${s.id}" aria-label="${s.title}截图，步骤结束 ${fmt(s.shot)}" data-tooltip="${s.title} · 点击查看大图" aria-pressed="false"><span class="tv-mini" aria-hidden="true"><b>${s.screen}</b><i></i><i></i><i></i></span><span>${fmt(s.shot)}${s.failed?' ×':''}</span></button>`).join('')}</div>
       <span class="tv-cursor"></span><button class="tv-playhead" role="slider" aria-label="时间轴游标" aria-valuemin="0" aria-valuemax="12800" aria-valuenow="0"></button>
      </div></div>
     </section>
     <div class="tv-evidence">
      <section class="tv-stage" aria-label="运行画面"><div class="tv-current"><span class="tv-current-title"></span><span class="tv-route tv-mono tv-mute"></span></div><div class="tv-canvas"><div class="tv-phone"><div class="tv-phone-top"><span>9:41</span><span>示意画面</span></div><h4 class="tv-screen"></h4><div class="tv-phone-line"></div><div class="tv-phone-box"></div><div class="tv-phone-line" style="width:60%"></div><div class="tv-phone-submit"></div></div></div><div class="tv-caption"><span class="tv-source"></span><span>按已采集截图回放</span></div></section>
      <section class="tv-inspector" aria-label="步骤详情"><div class="tv-tabs" role="tablist" aria-label="证据详情">${[['details','详情'],['error','错误'],['logs','日志'],['tree','UI 树']].map(([key,label])=>`<button class="cursor-interaction" role="tab" data-tab="${key}" id="tv-${variant}-${key}" aria-controls="tv-panel-${variant}" aria-selected="${key==='details'}">${label}</button>`).join('')}</div><div class="tv-detail" id="tv-panel-${variant}" role="tabpanel" aria-labelledby="tv-${variant}-details" aria-live="polite"></div></section>
     </div>
    </main>
   </div>
   <footer class="tv-footer"><span class="tv-selected-label"></span> · 时间轴、步骤、画面与详情同步选择</footer>`;
  function pause(){playing=false;cancelAnimationFrame(raf);app.querySelector('.tv-play').textContent='播放';}
  function render(){
   const s=steps.find(s=>s.id===selected),idx=steps.indexOf(s),image=s.shot===null?steps.slice(0,idx).reverse().find(x=>x.shot!==null):s;
   app.querySelectorAll('[data-step]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.step===selected)));
   app.querySelectorAll('[data-frame]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.frame===image.id)));
   app.querySelector('.tv-timer').textContent=fmt(time)+' / 12.8s';
   app.querySelector('.tv-cursor').style.left=(time/128)+'%';
   app.querySelector('.tv-playhead').style.left=(time/128)+'%';
   app.querySelector('.tv-playhead').setAttribute('aria-valuenow',String(Math.round(time)));
   app.querySelector('.tv-playhead').setAttribute('aria-valuetext',fmt(time));
   app.querySelector('.tv-current-title').textContent=(idx+1)+'. '+s.title;
   app.querySelector('.tv-route').textContent=s.route;
   app.querySelector('.tv-screen').textContent=image.screen;
   app.querySelector('.tv-phone-box').textContent=image.body;
   app.querySelector('.tv-phone-submit').textContent=image.button;
   app.querySelector('.tv-source').textContent=s.shot===null?'本步无截图 · 显示「'+image.title+'」 '+fmt(image.shot):'本步截图 · '+fmt(image.shot)+'（步骤结束）';
   app.querySelector('.tv-selected-label').textContent='当前：'+s.title;
   app.querySelector('.tv-prev').disabled=idx===0;
   app.querySelector('.tv-next').disabled=idx===steps.length-1;
   app.querySelector('.tv-frame-mode').value=frameMode;
   layoutFrames();
   app.querySelectorAll('[data-tab]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.tab===tab)));
   const panel=app.querySelector('.tv-detail');panel.setAttribute('aria-labelledby','tv-'+variant+'-'+tab);
   if(tab==='details')panel.innerHTML=`<h4>${s.title}</h4><dl><dt>结果</dt><dd class="${s.failed?'tv-fail':'tv-pass'}">${s.failed?'× 失败':'✓ 通过'}</dd><dt>耗时</dt><dd class="tv-mono">${fmt(s.end-s.start)}</dd><dt>执行区间</dt><dd class="tv-mono">${fmt(s.start)} → ${fmt(s.end)}</dd><dt>类型</dt><dd>${s.kind}</dd><dt>源码位置</dt><dd class="tv-mono">checkout.test.ts:${[18,23,29,35,38][idx]}</dd></dl><pre class="tv-code">${s.failed?"await expect(successPage)\n  .toBeVisible();":s.id==='submit'?"await submitButton.tap();":"await flow.step('"+s.title+"');"}</pre>`;
   else if(tab==='error')panel.innerHTML=s.failed?'<h4 class="tv-fail">× 等待成功页超时</h4><div>4,000ms 内未找到成功页。</div><pre class="tv-code">Expected: SuccessPage visible\nActual: /checkout\n\ncheckout.test.ts:38</pre>':'<h4>错误</h4><div class="tv-empty">本步骤没有错误。</div>';
   else if(tab==='logs')panel.innerHTML='<h4>当前步骤日志</h4><pre class="tv-code">'+fmt(s.start)+'  '+s.kind+' started\n'+(s.failed?'12.8s  assertion timed out':fmt(s.end)+'  operation completed')+'</pre>';
   else panel.innerHTML='<h4>已采集 UI 树 · 示意</h4><pre class="tv-code">Scaffold\n  AppBar\n    Text("'+image.screen+'")\n  Column\n    Text("'+image.body+'")\n    FilledButton</pre>';
  }
  function choose(id,t){pause();selected=id;time=t??steps.find(s=>s.id===id).start;render();save(id,time);}
  app.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>choose(el.dataset.step)));
  app.querySelectorAll('[data-frame]').forEach(el=>el.addEventListener('click',()=>choose(el.dataset.frame,steps.find(s=>s.id===el.dataset.frame).shot)));
  function seek(value){pause();time=Math.max(0,Math.min(12800,value));selected=(steps.find(s=>time>=s.start&&time<s.end)??steps.at(-1)).id;render();}
  const surface=app.querySelector('.tv-surface'),head=app.querySelector('.tv-playhead');
  const pointerTime=e=>{const rect=surface.getBoundingClientRect();return (e.clientX-rect.left)/rect.width*12800;};
  app.querySelector('.tv-scale').addEventListener('click',e=>{seek(pointerTime(e));save(selected,time);});
  app.querySelector('.tv-track').addEventListener('click',e=>{if(e.target.closest('button'))return;seek(pointerTime(e));save(selected,time);});
  let dragging=false;
  head.addEventListener('pointerdown',e=>{if(e.button!==0)return;pause();dragging=true;head.setPointerCapture(e.pointerId);seek(pointerTime(e));});
  head.addEventListener('pointermove',e=>{if(dragging)seek(pointerTime(e));});
  head.addEventListener('pointerup',e=>{dragging=false;head.releasePointerCapture(e.pointerId);save(selected,time);});
  head.addEventListener('pointercancel',()=>{dragging=false;});
  head.addEventListener('lostpointercapture',()=>{dragging=false;});
  head.addEventListener('keydown',e=>{const value={ArrowLeft:time-100,ArrowRight:time+100,Home:0,End:12800}[e.key];if(value!==undefined){e.preventDefault();seek(value);save(selected,time);}});
  function layoutFrames(){
   const width=surface.getBoundingClientRect().width||600,ends=[];
   steps.filter(s=>s.shot!==null).forEach(s=>{
    const frame=app.querySelector('[data-frame="'+s.id+'"]'),marker=app.querySelector('[data-marker="'+s.id+'"]');
    const visible=frameMode==='all'||frameMode==='failed'&&s.failed;
    frame.hidden=!visible;marker.hidden=!visible;if(!visible)return;
    const left=Math.max(0,Math.min(s.shot/12800*width-38,width-76));
    let lane=ends.findIndex(end=>end+8<=left);if(lane<0)lane=ends.length;ends[lane]=left+76;
    frame.style.left=left+'px';frame.style.top=(lane*126+6)+'px';marker.style.height=(lane*126+6)+'px';
   });
   app.querySelector('.tv-filmstrip').style.height=(ends.length?ends.length*126+6:0)+'px';
  }
  const resize=new ResizeObserver(layoutFrames);resize.observe(surface);layoutFrames();
  app.querySelector('.tv-prev').addEventListener('click',()=>choose(steps[Math.max(0,steps.findIndex(s=>s.id===selected)-1)].id));
  app.querySelector('.tv-next').addEventListener('click',()=>choose(steps[Math.min(steps.length-1,steps.findIndex(s=>s.id===selected)+1)].id));
  app.querySelector('.tv-jump').addEventListener('click',()=>choose('assert'));
  app.querySelector('.tv-speed').addEventListener('change',e=>{speed=Number(e.target.value);last=0;});
  app.querySelector('.tv-frame-mode').addEventListener('change',e=>{frameMode=e.target.value;render();});
  app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab;render();}));
  app.querySelector('.tv-play').addEventListener('click',()=>{
   if(playing){pause();save(selected,time);return;}
   if(time>=12800)time=0;
   playing=true;last=0;app.querySelector('.tv-play').textContent='暂停';
   const tick=now=>{if(!playing)return;if(last)time=Math.min(12800,time+(now-last)*speed);last=now;selected=(steps.find(s=>time>=s.start&&time<s.end)??steps.at(-1)).id;render();if(time>=12800){pause();save(selected,time);}else raf=requestAnimationFrame(tick);};
   raf=requestAnimationFrame(tick);
  });
  const observer=new MutationObserver(()=>{if(app.closest('[data-variant]').hidden)pause();});observer.observe(app.closest('[data-variant]'),{attributes:true,attributeFilter:['hidden']});
  render();
 });
})();
</script>
