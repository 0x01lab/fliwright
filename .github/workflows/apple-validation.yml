name: Apple platform validation

on: workflow_dispatch

permissions:
  contents: read

jobs:
  e2e:
    name: Generated Flutter E2E smoke
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fliwright/cli... build
      - run: pnpm --filter @fliwright/e2e-tests test
        env:
          FLIWRIGHT_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-flutter-smoke
          path: e2e-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore

  ios:
    name: Mobile compile (ios)
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: node scripts/verify-mobile-build.mjs ios
      - name: Compile iOS XCTest runner without signing
        run: >-
          xcodebuild build-for-testing
          -project packages/fliwright-native/runners/ios/FliwrightRunner.xcodeproj
          -scheme FliwrightRunner -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/fliwright-xctest"
          CODE_SIGNING_ALLOWED=NO
      - uses: pnpm/action-setup@v4
      - name: Test XCTest session lifecycle on macOS
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @fliwright/native... build
          pnpm --filter @fliwright/native exec vitest run tests/XctestRunner.test.ts --maxWorkers=2
