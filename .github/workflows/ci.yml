name: Continuous integration

on:
  pull_request:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    name: Harness governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Test pub.dev release tooling
        run: node --test scripts/pub-release.test.mjs

      - name: Validate Harness
        if: github.event_name == 'pull_request'
        run: node scripts/verify-harness.mjs --base "${{ github.event.pull_request.base.sha }}"

      - name: Validate Harness baseline
        if: github.event_name != 'pull_request'
        run: node scripts/verify-harness.mjs

  typescript:
    name: TypeScript quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:cli:check
      - run: pnpm lint
      - run: pnpm --workspace-concurrency=1 --filter './packages/*' -r run test --maxWorkers=2
      - run: pnpm plugin:check -- --strict-plugin --skip-cli
      - run: pnpm package:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-run-evidence
          path: |
            **/.fliwright/runs/
            ~/.fliwright/projects/*/runs/
            **/junit.xml
          include-hidden-files: true
          if-no-files-found: ignore

  dart:
    name: Dart and Flutter quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test Dart and Flutter projects
        run: |
          for project in \
            packages/fliwright-bridge \
            packages/fliwright-bridge-riverpod \
            packages/fliwright-design-qa \
            examples/form_demo \
            examples/go_router_demo \
            examples/riverpod_demo; do
            (
              cd "$project"
              flutter pub get
              flutter analyze .
              flutter test --concurrency=1
            )
          done

      - name: Validate publishable Dart packages
        run: |
          for project in \
            packages/fliwright-bridge \
            packages/fliwright-bridge-riverpod \
            packages/fliwright-design-qa; do
            (cd "$project" && flutter pub publish --dry-run)
          done

  e2e:
    name: Generated Flutter E2E smoke
    runs-on: macos-latest
    needs: [typescript, dart]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fliwright/cli... build
      - run: pnpm --filter @fliwright/e2e-tests test
        env:
          FLIWRIGHT_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-flutter-smoke
          path: e2e-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore

  quality-gate:
    name: CI quality gate
    if: always()
    needs: [harness, typescript, dart, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          const failed = Object.entries(jobs).filter(([, job]) => job.result !== 'success');
          if (failed.length) {
            console.error('Required jobs did not pass:', failed.map(([name, job]) => `${name}: ${job.result}`).join(', '));
            process.exit(1);
          }
          JS
