name: Release VS Code extension

on:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read

  publish:
    needs: quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify release tag matches extension version
        shell: bash
        run: |
          version="$(node -p "require('./packages/fliwright-vscode/package.json').version")"
          expected_tag="vscode-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match extension version ${version}. Expected ${expected_tag}." >&2
            exit 1
          fi

      - name: Build workspace dependencies
        run: pnpm --filter fliwright-vscode... build

      - name: Lint and unit test extension
        run: pnpm --filter fliwright-vscode run lint && pnpm --filter fliwright-vscode run test

      - name: Build extension
        run: pnpm --filter fliwright-vscode run build

      - name: Run VS Code integration test
        run: xvfb-run -a pnpm --filter fliwright-vscode run test:integration

      - name: Package VSIX
        run: pnpm --filter fliwright-vscode run package

      - name: Test packaged VSIX
        run: xvfb-run -a pnpm --filter fliwright-vscode run test:vsix

      - name: Publish to VS Code Marketplace
        run: node scripts/publish-vscode.mjs

      - name: Upload VSIX to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/fliwright-vscode/fliwright-vscode-*.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
