name: Publish npm packages

on:
  push:
    tags:
      - 'npm-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read

  publish:
    needs: quality
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches the complete public dependency graph
        run: node scripts/release-packages.mjs verify

      - run: pnpm --filter './packages/*' --filter '!@fliwright/cloud*' -r run build
      - run: pnpm --filter './packages/*' --filter '!@fliwright/cloud*' -r run lint
      # Keep package suites from competing for CPU and filesystem budgets.
      - run: pnpm --workspace-concurrency=1 --filter './packages/*' --filter '!@fliwright/cloud*' -r run test --maxWorkers=2
      - run: pnpm package:check

      - name: Publish in dependency order with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#npm-v}"
          publish_if_missing() {
            package_name="$1"
            if npm view "${package_name}@${version}" version --silent >/dev/null 2>&1; then
              echo "${package_name}@${version} already exists; skipping publish."
            else
              pnpm --filter "${package_name}" publish --no-git-checks
            fi
          }
          # Materialize the list first so discovery errors cannot become an empty successful loop.
          node scripts/release-packages.mjs list > "$RUNNER_TEMP/npm-release-packages.txt"
          while IFS= read -r package_name; do
            publish_if_missing "$package_name"
          done < "$RUNNER_TEMP/npm-release-packages.txt"

      - name: Verify published registry consumer
        env:
          FLIWRIGHT_REGISTRY_VERSION: ${{ github.ref_name }}
        run: node scripts/verify-registry-consumer.mjs
