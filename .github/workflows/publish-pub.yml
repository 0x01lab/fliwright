name: Publish Dart packages

on:
  push:
    tags:
      - 'fliwright_bridge-v*'
      - 'fliwright_bridge_riverpod-v*'
      - 'fliwright_design_qa-v*'

permissions:
  contents: read

concurrency:
  group: pub-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/release-gate.yml

  publish:
    needs: quality
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # Provisions OIDC credentials; Flutter below supplies the matching Dart SDK.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release and check existing version
        id: package
        run: node scripts/pub-release.mjs prepare

      - name: Verify dependencies resolve from pub.dev without local overrides
        if: steps.package.outputs.published != 'true'
        run: node scripts/pub-release.mjs check-dependencies

      - name: Install dependencies
        if: steps.package.outputs.published != 'true'
        working-directory: ${{ steps.package.outputs.dir }}
        run: flutter pub get

      - name: Publish dry run
        if: steps.package.outputs.published != 'true'
        working-directory: ${{ steps.package.outputs.dir }}
        run: flutter pub publish --dry-run

      - name: Publish to pub.dev
        if: steps.package.outputs.published != 'true'
        working-directory: ${{ steps.package.outputs.dir }}
        run: flutter pub publish --force

      - name: Verify published package in a clean Flutter consumer
        run: node scripts/pub-release.mjs verify
