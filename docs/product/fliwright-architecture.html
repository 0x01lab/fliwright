<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fliwright 模块架构</title><style>*{box-sizing:border-box}body{margin:0;background:#fff}svg{display:block;width:100%;height:auto}@page{size:480mm 448mm;margin:0}@media print{svg{width:480mm;height:448mm}}</style><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1792" viewBox="0 0 1920 1792" role="img" aria-labelledby="title desc"><title id="title">Fliwright 模块架构与配置协作</title><desc id="desc">CLI、Vitest 和 VS Code 复用 Core 自动化运行时，Core 通过 Dart VM Service 连接 Flutter Bridge。Cloud Server 用 cloud-protocol 契约通过 WSS 管理设备主机 Worker，Worker 调用 CLI 和 Vitest 执行测试，并通过 HTTPS 发布证据。Devices 负责发现，Native 负责 ADB 和 XCTest 操作。Riverpod 为两端可选扩展。底部说明项目、App、Worker 与 Cloud 的配置职责；TDD、测试计划与 Design QA 作为按需扩展。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526977"/></marker></defs><rect x="0" y="0" width="1920" height="1792" rx="0" fill="#ffffff" stroke="none"/><text x="64" y="66" font-size="18" font-weight="700" fill="#256b5e">FLIWRIGHT</text><text x="64" y="120" font-size="42" font-weight="700" fill="#173545">模块架构与配置协作</text><text x="1016" y="70" font-size="19" font-weight="500" fill="#526977">实线：主要调用 / 数据通路</text><text x="1016" y="104" font-size="19" font-weight="400" fill="#526977">虚线：可选接入通路　｜　节点内列出职责和对应包</text><text x="64" y="166" font-size="18" font-weight="650" fill="#526977">使用入口 · 开发者与 CI</text><text x="520" y="166" font-size="18" font-weight="650" fill="#526977">共享执行能力 · Node.js</text><text x="1300" y="166" font-size="18" font-weight="650" fill="#526977">团队云测 · Server 与设备主机</text><path d="M 424 260 H 512" fill="none" stroke="#526977" stroke-width="2.5" stroke-linejoin= "650" fill="#173545">场景与 Mock</text><text x="566" y="509" font-size="17" font-weight="400" fill="#526977">环境分层 / 命名规则</text><rect x="872" y="446" width="300" height="88" rx="6" fill="#ffffff" stroke="none"/><text x="890" y="478" font-size="22" font-weight="650" fill="#173545">录制与生成</text><text x="890" y="509" font-size="17" font-weight="400" fill="#526977">操作事件 / 候选代码</text><rect x="548" y="554" width="300" height="88" rx="6" fill="#ffffff" stroke="none"/><text x="566" y="586" font-size="22" font-weight="650" fill="#173545">运行证据</text><text x="566" y="617" font-size="17" font-weight="400" fill="#526977">截图 / Timeline / Trace</text><rect x="872" y="554" width="300" height="88" rx="6" fill="#ffffff" stroke="none"/><text x="890" y="586" font-size="22" font-weight="650" fill="#173545">辅助能力</text><text x="890" y="617" font-size="17" font-weight="400" fill="#526977">表单 / AI / Flow（选配）</text><text x="548" y="701" font-size="18" font-weight="400" fill="#526977">上层复用这些能力；场景、Mock、录制等为 Core 内的功能模块。</text><rect x="1300" y="196" width="556" height="160" rx="10" fill="#e4f1ed" stroke="none"/><text x="1324" y="232" font-size="25" font-weight="650" fill="#173545">Cloud Server · 团队控制台</text><text x="1324" y="263" font-size="17" font-weight="500" fill="#256b5e">@fliwright/cloud</text><text x="1324" y="297" font-size="20" font-weight="400" fill="#526977">项目配置、队列调度、设备策略、报告与分享</text><text x="1370" y="397" font-size="20" font-weight="650" fill="#256b5e">cloud-protocol · 双方共享的通信契约</text><text x="1370" y="429" font-size="18" font-weight="400" fill="#526977">WSS：任务 / 状态 / 取消　HTTPS：证据上传</text><text x="1370" y="458" font-size="16" font-weight="400" fill="#526977">@fliwright/cloud-protocol（随服务部署的库）</text><rect x="1300" y="484" width="556" height="208" rx="10" fill="#f0f4f5" stroke="none"/><text x="1324" y="520" font-size="25" font-weight="650" fill="#173545">Worker · 设备主机执行</text><text x="1324" y="551" font-size="17" font-weight="500" fill="#256b5e">@fliwright/cloud-worker</text><text x="1324" y="585" font-size="20" font-weight="400" fill="#526977">主动连接 Server，同步设备绑定与槽位</text><text x="1324" y="614" font-size="20" font-weight="400" fill="#526977">检出固定版本 → CLI / Vitest 执行 → 上传报告</text><text x="1324" y="672" font-size="17" font-weight="500" fill="#526977">控制与证据沿上方双向连接传输；执行能力复用左侧 Core。</text><rect x="1300" y="756" width="556" height="120" rx="10" fill="#f0f4f5" stroke="none"/><text x="1324" y="792" font-size="25" font-weight="650" fill="#173545">Devices · 设备发现</text><text x="1324" y="823" font-size="17" font-weight="500" fill="#256b5e">@fliwright/devices</text><text x="1324" y="857" font-size="20" font-weight="400" fill="#526977">扫描 iOS / Android；提供清单与工具诊断</text><text x="1300" y="910" font-size="17" font-weight="400" fill="#526977">以下原生操作能力按需启用，发现设备不等于获得操作权限。</text><rect x="1300" y="936" width="556" height="168" rx="10" fill="#f0f4f5" stroke="none"/><text x="1324" y="972" font-size="25" font-weight="650" fill="#173545">Native · 系统界面与设备控制</text><text x="1324" y="1003" font-size="17" font-weight="500" fill="#256b5e">@fliwright/native</text><text x="1324" y="1037" font-size="20" font-weight="400" fill="#526977">Android ADB / iOS XCTest、设备独占与进程绑定</text><text x="1324" y="1084" font-size="17" font-weight="500" fill="#526977">需指定平台、设备、App ID 和工具 / Runner；按平台验收。</text><rect x="64" y="756" width="360" height="136" rx="10" fill="#f0f4f5" stroke="none"/><text x="88" y="792" font-size="25" font-weight="650" fill="#173545">Riverpod · TypeScript 适配</text><text x="88" y="823" font-size="17" font-weight="500" fill="#256b5e">@fliwright/plugin-riverpod</text><text x="88" y="857" font-size="20" font-weight="400" fill="#526977">状态读取、监听与适配器注册</text><text x="64" y="932" font-size="18" font-weight="650" fill="#526977">可选 Riverpod 扩展，需要两端都接入</text><rect x="64" y="956" width="360" height="152" rx="10" fill="#f0f4f5" stroke="none"/><text x="88" y="992" font-size="25" font-weight="650" fill="#173545">Riverpod · App 内适配</text><text x="88" y="1023" font-size="17" font-weight="500" fill="#256b5e">fliwright_bridge_riverpod</text><text x="88" y="1057" font-size="20" font-weight="400" fill="#526977">Observer 暴露 Provider 状态</text><text x="88" y="1088" font-size="17" font-weight="500" fill="#526977">写入需 App 明确注册可写 Provider。</text><text x="904" y="786" font-size="22" font-weight="650" fill="#256b5e">Dart VM Service</text><text x="904" y="818" font-size="19" font-weight="400" fill="#526977">动作请求、状态、事件与截图</text><text x="520" y="872" font-size="18" font-weight="650" fill="#526977">App 内部 · 可信调试 / 测试构建</text><rect x="520" y="900" width="700" height="164" rx="10" fill="#e4f1ed" stroke="none"/><text x="544" y="936" font-size="25" font-weight="650" fill="#173545">Bridge · Flutter 侧接入层</text><text x="544" y="967" font-size="17" font-weight="500" fill="#256b5e">fliwright_bridge</text><text x="544" y="1001" font-size="20" font-weight="400" fill="#526977">Widget 查询、手势、截图、录制与网络 Mock 扩展</text><text x="544" y="1044" font-size="17" font-weight="500" fill="#526977">专用测试入口初始化；Release 模式不启用。</text><rect x="520" y="1132" width="700" height="124" rx="10" fill="#f0f4f5" stroke="none"/><text x="544" y="1168" font-size="25" font-weight="650" fill="#173545">Flutter App · 被测业务系统</text><text x="544" y="1199" font-size="17" font-weight="500" fill="#256b5e">团队自己的应用</text><text x="544" y="1233" font-size="20" font-weight="400" fill="#526977">页面、路由、网络、存储、身份与业务状态</text><text x="64" y="1158" font-size="19" font-weight="650" fill="#173545">App 自有能力：</text><text x="64" y="1190" font-size="18" font-weight="400" fill="#526977">路由、存储重置、auth.seedLoggedIn</text><text x="64" y="1218" font-size="18" font-weight="400" fill="#526977">按所需场景逐项注册到 Bridge。</text><text x="64" y="1310" font-size="20" font-weight="650" fill="#526977">按需扩展 · 通过现有入口 / API 接入</text><rect x="64" y="1330" width="568" height="120" rx="8" fill="#f0f4f5" stroke="none"/><text x="84" y="1362" font-size="23" font-weight="650" fill="#173545">持续 TDD（Labs）</text><text x="84" y="1392" font-size="17" font-weight="500" fill="#256b5e">@fliwright/tdd</text><text x="84" y="1422" font-size="17" font-weight="400" fill="#526977">CLI tdd → 聚焦重跑、重载 / 重启与基线重置</text><rect x="660" y="1330" width="568" height="120" rx="8" fill="#f0f4f5" stroke="none"/><text x="680" y="1362" font-size="23" font-weight="650" fill="#173545">验收计划</text><text x="680" y="1392" font-size="17" font-weight="500" fill="#256b5e">@fliwright/test-plan + Skills</text><text x="680" y="1422" font-size="17" font-weight="400" fill="#526977">GitLab 验收条目 → 用例绑定 → 报告覆盖</text><rect x="1256" y="1330" width="600" height="120" rx="8" fill="#f0f4f5" stroke="none"/><text x="1276" y="1362" font-size="23" font-weight="650" fill="#173545">设计联动（Labs）</text><text x="1276" y="1392" font-size="17" font-weight="500" fill="#256b5e">fliwright_design_qa / Core Flow</text><text x="1276" y="1422" font-size="17" font-weight="400" fill="#526977">App 配对与截图传输；Flow 另配置 Figma 绑定</text><text x="64" y="1500" font-size="25" font-weight="700" fill="#173545">配置放在哪里 · 四方约定把模块连接起来</text><rect x="64" y="1522" width="428" height="174" rx="8" fill="#f0f4f5" stroke="none"/><text x="82" y="1557" font-size="23" font-weight="650" fill="#173545">项目仓库</text><text x="82" y="1588" font-size="15" font-weight="500" fill="#256b5e">fliwright.config.ts / vitest.config.ts</text><text x="82" y="1622" font-size="16" font-weight="400" fill="#526977">tests、scripts、scenarios、Mock 规则</text><text x="82" y="1649" font-size="16" font-weight="400" fill="#526977">preset 读取项目配置；CLI / 编辑器共用</text><rect x="516" y="1522" width="428" height="174" rx="8" fill="#f0f4f5" stroke="none"/><text x="534" y="1557" font-size="23" font-weight="650" fill="#173545">Flutter App</text><text x="534" y="1588" font-size="15" font-weight="500" fill="#256b5e">test_driver/fliwright_app.dart</text><text x="534" y="1622" font-size="16" font-weight="400" fill="#526977">Bridge 初始化；按需注册路由 / 状态 / Mock</text><text x="534" y="1649" font-size="16" font-weight="400" fill="#526977">测试代码的 Key、路由与能力名需对应 App</text><rect x="968" y="1522" width="428" height="174" rx="8" fill="#f0f4f5" stroke="none"/><text x="986" y="1557" font-size="23" font-weight="650" fill="#173545">Worker 私有主机</text><text x="986" y="1588" font-size="15" font-weight="500" fill="#256b5e">worker.json / credentials.json</text><text x="986" y="1622" font-size="16" font-weight="400" fill="#526977">serverUrl、凭据、Flutter / SDK、仓库凭据</text><text x="986" y="1649" font-size="16" font-weight="400" fill="#526977">配对后同步网页绑定；特殊平台配置 reset</text><rect x="1420" y="1522" width="428" height="174" rx="8" fill="#f0f4f5" stroke="none"/><text x="1438" y="1557" font-size="23" font-weight="650" fill="#173545">Cloud 服务与网页</text><text x="1438" y="1588" font-size="15" font-weight="500" fill="#256b5e">server.json + 网页项目 / 设备配置</text><text x="1438" y="1622" font-size="16" font-weight="400" fill="#526977">服务身份、数据目录；仓库、入口、套件、版本</text><text x="1438" y="1649" font-size="16" font-weight="400" fill="#526977">纳管设备并授权应用；扫描目录后确认 ready</text><text x="64" y="1743" font-size="18" font-weight="400" fill="#526977">2026-11-09 · Developer Preview · 当前工作区实现；箭头为主要协作通路，不是完整的包依赖图。</text><text x="64" y="1771" font-size="17" font-weight="400" fill="#526977">说明：Devices 只负责发现；Worker 负责本机执行与重置；Cloud 负责集中策略与调度；常规本地测试无需部署 Cloud。</text></svg></html>
