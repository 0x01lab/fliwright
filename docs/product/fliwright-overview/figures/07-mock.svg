<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 205" role="img" aria-label="请求命中已启用的 Mock 规则后，使用指定响应；示意不代表所有网络栈自动接管。"><title>请求命中已启用的 Mock 规则后，使用指定响应；示意不代表所有网络栈自动接管。</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152f40}.node{fill:#f0f4f5}.focus{fill:#e0f0ec}.dark{fill:#173a48}.title{font-size:22px;font-weight:650}.sub{font-size:16px;fill:#526674}.tag{font-size:14px;font-weight:650;fill:#246759}.line{fill:none;stroke:#617986;stroke-width:2}.dash{stroke-dasharray:6 5}.white{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617986"/></marker></defs><line x1="288" y1="112" x2="408" y2="112" class="line" marker-end="url(#arrow)"/><line x1="712" y1="112" x2="824" y2="112" class="line" marker-end="url(#arrow)"/><rect x="0" y="48" width="288" height="128" rx="8" class="node"/><text x="20" y="90" class="title" text-anchor="start">App 发起请求</text><text x="20" y="120" class="sub" text-anchor="start">接口与业务行为不变</text><rect x="408" y="48" width="304" height="128" rx="8" class="focus"/><text x="428" y="90" class="title" text-anchor="start">匹配 Mock 规则</text><text x="428" y="120" class="sub" text-anchor="start">按接口 / 方法 / 命名规则</text><rect x="824" y="48" width="296" height="128" rx="8" class="node"/><text x="844" y="90" class="title" text-anchor="start">返回指定响应</text><text x="844" y="120" class="sub" text-anchor="start">成功 / 空态 / 错误</text></svg>