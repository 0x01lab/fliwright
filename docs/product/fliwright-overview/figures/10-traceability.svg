<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" role="img" aria-label="GitLab 验收条目 → 测试计划 → 已绑定用例 → 运行证据 → 审核报告。"><title>GitLab 验收条目 → 测试计划 → 已绑定用例 → 运行证据 → 审核报告。</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152f40}.node{fill:#f0f4f5}.focus{fill:#e0f0ec}.dark{fill:#173a48}.title{font-size:22px;font-weight:650}.sub{font-size:16px;fill:#526674}.tag{font-size:14px;font-weight:650;fill:#246759}.line{fill:none;stroke:#617986;stroke-width:2}.dash{stroke-dasharray:6 5}.white{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617986"/></marker></defs><line x1="256.0" y1="96.0" x2="283.0" y2="96.0" class="line" marker-end="url(#arrow)"/><line x1="544.0" y1="96.0" x2="571.0" y2="96.0" class="line" marker-end="url(#arrow)"/><line x1="832.0" y1="96.0" x2="859.0" y2="96.0" class="line" marker-end="url(#arrow)"/><rect x="0.0" y="40" width="256.0" height="112" rx="8" class="node"/><text x="20.0" y="82" class="title" text-anchor="start">验收条目</text><text x="20.0" y="112" class="sub" text-anchor="start">保留原文与来源</text><rect x="288.0" y="40" width="256.0" height="112" rx="8" class="node"/><text x="308.0" y="82" class="title" text-anchor="start">测试计划</text><text x="308.0" y="112" class="sub" text-anchor="start">逐项映射测试用例</text><rect x="576.0" y="40" width="256.0" height="112" rx="8" class="node"/><text x="596.0" y="82" class="title" text-anchor="start">执行验证</text><text x="596.0" y="112" class="sub" text-anchor="start">绑定脚本与实际结果</text><rect x="864.0" y="40" width="256.0" height="112" rx="8" class="focus"/><text x="884.0" y="82" class="title" text-anchor="start">审核报告</text><text x="884.0" y="112" class="sub" text-anchor="start">覆盖、结论与证据缺口</text><text x="0" y="202" class="sub" text-anchor="start">这是 Skill 与独立 test-plan 工具的协作流程；需要项目与 GitLab 权限配置。</text></svg>