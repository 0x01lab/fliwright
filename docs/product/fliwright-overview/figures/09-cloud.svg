<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" role="img" aria-label="网页或 GitLab 提交 → Cloud 队列 → Worker 与执行槽位 → 报告发布与分享。"><title>网页或 GitLab 提交 → Cloud 队列 → Worker 与执行槽位 → 报告发布与分享。</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152f40}.node{fill:#f0f4f5}.focus{fill:#e0f0ec}.dark{fill:#173a48}.title{font-size:22px;font-weight:650}.sub{font-size:16px;fill:#526674}.tag{font-size:14px;font-weight:650;fill:#246759}.line{fill:none;stroke:#617986;stroke-width:2}.dash{stroke-dasharray:6 5}.white{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617986"/></marker></defs><line x1="252" y1="100" x2="352" y2="100" class="line" marker-end="url(#arrow)"/><line x1="680" y1="100" x2="776" y2="100" class="line" marker-end="url(#arrow)"/><line x1="948" y1="168" x2="948" y2="220" class="line" marker-end="url(#arrow)"/><rect x="0" y="36" width="252" height="128" rx="8" class="node"/><text x="20" y="78" class="title" text-anchor="start">提交任务</text><text x="20" y="108" class="sub" text-anchor="start">网页 / GitLab 触发</text><rect x="352" y="36" width="328" height="128" rx="8" class="focus"/><text x="372" y="78" class="title" text-anchor="start">Cloud Server</text><text x="372" y="108" class="sub" text-anchor="start">项目 · 队列 · 调度</text><rect x="776" y="36" width="344" height="128" rx="8" class="node"/><text x="796" y="78" class="title" text-anchor="start">设备主机 Worker</text><text x="796" y="108" class="sub" text-anchor="start">拉取固定版本并执行</text><rect x="776" y="228" width="344" height="100" rx="8" class="node"/><text x="796" y="270" class="title" text-anchor="start">已配置的执行槽位</text><text x="796" y="300" class="sub" text-anchor="start">设备占用、运行与重置</text><path d="M 776 288 H 688 Q 680 288 680 296 V 304 H 628" class="line" marker-end="url(#arrow)"/><rect x="0" y="228" width="620" height="124" rx="8" class="focus"/><text x="20" y="270" class="title" text-anchor="start">报告与团队回放</text><text x="20" y="300" class="sub" text-anchor="start">截图与时间轴 · 运行结论 · 分享与撤销</text></svg>