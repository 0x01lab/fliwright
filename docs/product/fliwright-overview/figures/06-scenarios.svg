<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 356" role="img" aria-label="示意：组合基础状态、接口规则和起始页面，形成可复用命名场景。"><title>示意：组合基础状态、接口规则和起始页面，形成可复用命名场景。</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152f40}.node{fill:#f0f4f5}.focus{fill:#e0f0ec}.dark{fill:#173a48}.title{font-size:22px;font-weight:650}.sub{font-size:16px;fill:#526674}.tag{font-size:14px;font-weight:650;fill:#246759}.line{fill:none;stroke:#617986;stroke-width:2}.dash{stroke-dasharray:6 5}.white{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617986"/></marker></defs><rect x="0" y="24" width="360" height="112" rx="8" class="focus"/><text x="20" y="66" class="title" text-anchor="start">基础场景</text><text x="20" y="96" class="sub" text-anchor="start">统一初始状态</text><path d="M 180 136 V 168 Q 180 176 188 176 H 232 Q 240 176 240 184 V 216" class="line" marker-end="url(#arrow)"/><rect x="380" y="24" width="360" height="112" rx="8" class="node"/><text x="400" y="66" class="title" text-anchor="start">接口规则</text><text x="400" y="96" class="sub" text-anchor="start">成功 / 空态 / 异常</text><line x1="560" y1="136" x2="560" y2="216" class="line" marker-end="url(#arrow)"/><rect x="760" y="24" width="360" height="112" rx="8" class="node"/><text x="780" y="66" class="title" text-anchor="start">起始页面</text><text x="780" y="96" class="sub" text-anchor="start">固定业务入口</text><path d="M 940 136 V 168 Q 940 176 932 176 H 888 Q 880 176 880 184 V 216" class="line" marker-end="url(#arrow)"/><rect x="120" y="224" width="880" height="116" rx="8" class="focus"/><text x="140" y="266" class="title" text-anchor="start">命名场景：profile-edit-empty</text><text x="140" y="296" class="sub" text-anchor="start">继承基础场景 → 应用准备层 → 就绪检查 → 再执行测试</text></svg>