<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" role="img" aria-label="录制 → 生成候选代码 → 确认断言与场景 → 回放验证；失败或缺少证据时继续保留草稿。"><title>录制 → 生成候选代码 → 确认断言与场景 → 回放验证；失败或缺少证据时继续保留草稿。</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152f40}.node{fill:#f0f4f5}.focus{fill:#e0f0ec}.dark{fill:#173a48}.title{font-size:22px;font-weight:650}.sub{font-size:16px;fill:#526674}.tag{font-size:14px;font-weight:650;fill:#246759}.line{fill:none;stroke:#617986;stroke-width:2}.dash{stroke-dasharray:6 5}.white{fill:#fff}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617986"/></marker></defs><line x1="256.0" y1="96.0" x2="283.0" y2="96.0" class="line" marker-end="url(#arrow)"/><line x1="544.0" y1="96.0" x2="571.0" y2="96.0" class="line" marker-end="url(#arrow)"/><line x1="832.0" y1="96.0" x2="859.0" y2="96.0" class="line" marker-end="url(#arrow)"/><rect x="0.0" y="40" width="256.0" height="112" rx="8" class="node"/><text x="20.0" y="82" class="title" text-anchor="start">录制操作</text><text x="20.0" y="112" class="sub" text-anchor="start">点击 / 输入 / 页面流转</text><rect x="288.0" y="40" width="256.0" height="112" rx="8" class="node"/><text x="308.0" y="82" class="title" text-anchor="start">生成候选</text><text x="308.0" y="112" class="sub" text-anchor="start">可编辑的自动化代码</text><rect x="576.0" y="40" width="256.0" height="112" rx="8" class="node"/><text x="596.0" y="82" class="title" text-anchor="start">补齐验证</text><text x="596.0" y="112" class="sub" text-anchor="start">目标、断言与命名场景</text><rect x="864.0" y="40" width="256.0" height="112" rx="8" class="focus"/><text x="884.0" y="82" class="title" text-anchor="start">回放通过</text><text x="884.0" y="112" class="sub" text-anchor="start">同一候选与环境验证</text><text x="0" y="202" class="sub" text-anchor="start">录制结果可能停留在草稿或已生成状态；验证记录与候选内容、场景绑定。</text></svg>